server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Rotas do Vue (ex.: /avisos/3) caem no index.html; o vue-router resolve no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos gerados pelo build têm nome com hash: podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
